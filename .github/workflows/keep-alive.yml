name: Mantener Supabase activo
# El plan gratis de Supabase pausa el proyecto tras 7 días sin uso.
# Esta consulta liviana cada 3 días lo mantiene despierto.
on:
  schedule:
    - cron: "17 9 */3 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta a la base
        run: |
          curl -fsS "https://ripixdsfbqnuryvimfiu.supabase.co/rest/v1/animales?select=id&limit=1" \
            -H "apikey: sb_publishable_XIJgoW0qQwLSW7NFDhfZmg_OwnR6hY6" > /dev/null && echo "Supabase OK"
